spring.application.name=devoluciones.garantias-test

# Base de datos exclusiva para pruebas
spring.datasource.url=jdbc:h2:mem:garantias-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de Hibernate para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración del módulo
warranty.period-months=3